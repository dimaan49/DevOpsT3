[defaults]
roles_path = roles
retry_files_enabled = False
# Проверка ключей хоста включена (по умолчанию) — не отключать.
host_key_checking = True
interpreter_python = auto_silent
# Не печатать значения переменных в логах при ошибках, если task помечен no_log.
display_skipped_hosts = False

[ssh_connection]
pipelining = True
